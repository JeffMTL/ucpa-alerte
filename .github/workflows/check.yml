name: Surveillance UCPA

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = verifier | list = voir les cours | test = notification de test"
        default: "check"
        type: choice
        options: [check, list, test]
      week:
        description: "Pour list : 0 = semaine en cours, 1 = suivante..."
        default: "0"

permissions:
  contents: write

concurrency:
  group: ucpa-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Executer
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 ucpa_alert.py ${{ inputs.mode || 'check' }} --week ${{ inputs.week || '0' }}
      - name: Sauvegarder l'etat
        run: |
          git config user.name "ucpa-alert"
          git config user.email "ucpa-alert@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "maj etat" && git push)
